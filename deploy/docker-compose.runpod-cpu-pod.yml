services:
  postgres:
    network_mode: host

  redis:
    network_mode: host

  app-backend:
    network_mode: host
    ports: []
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@127.0.0.1:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://127.0.0.1:6379

  dashboard-web:
    network_mode: host
    ports: []
    environment:
      PORT: "3001"
