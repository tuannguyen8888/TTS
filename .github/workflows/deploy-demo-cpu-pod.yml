name: Deploy Demo CPU Pod (Backend + Dashboard)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "deploy/**"
      - ".github/workflows/deploy-demo-cpu-pod.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy over SSH (Runpod gateway)
        shell: bash
        run: |
          set -euo pipefail

          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          USER="${{ secrets.DEPLOY_USER }}"
          REPO_PATH="${{ secrets.DEPLOY_REPO_PATH }}"
          BRANCH="${{ vars.DEPLOY_BRANCH }}"
          if [ -z "$BRANCH" ]; then BRANCH="main"; fi
          POD_ID="${USER%%-*}"

          set +e
          timeout 25m ssh -tt \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p "$PORT" \
            "$USER@$HOST" <<EOF
          set -e

          REPO_PATH="$REPO_PATH"
          BRANCH="$BRANCH"
          test -f "\$REPO_PATH/deploy/.env" || (echo "Missing deploy/.env on server" && exit 1)
          cd "\$REPO_PATH"
          git fetch origin "\$BRANCH"
          git checkout "\$BRANCH"
          git pull --ff-only origin "\$BRANCH"
          chmod +x "\$REPO_PATH/deploy/runpod-cpu-pod/"*.sh
          "\$REPO_PATH/deploy/runpod-cpu-pod/bootstrap-native.sh" "\$REPO_PATH"
          "\$REPO_PATH/deploy/runpod-cpu-pod/deploy-native.sh" "\$REPO_PATH" "\$BRANCH"
          exit
          EOF
          SSH_RC=$?
          set -e
          if [ "$SSH_RC" -ne 0 ] && [ "$SSH_RC" -ne 124 ]; then
            echo "SSH deploy failed with exit code $SSH_RC"
            exit "$SSH_RC"
          fi
          if [ "$SSH_RC" -eq 124 ]; then
            echo "SSH session timed out after deploy window. Verifying services via HTTP..."
          fi

          curl -fsS "https://${POD_ID}-8001.proxy.runpod.net/healthz" >/tmp/backend_health.json
          curl -fsSI "https://${POD_ID}-8081.proxy.runpod.net/" >/tmp/dashboard_head.txt
          grep -q '"status":"ok"' /tmp/backend_health.json
          grep -Eq '^HTTP/2 200|^HTTP/1.1 200' /tmp/dashboard_head.txt
          echo "Verified backend and dashboard public endpoints."
