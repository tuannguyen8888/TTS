name: Deploy Demo CPU Pod (Backend + Dashboard)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "deploy/**"
      - ".github/workflows/deploy-demo-cpu-pod.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            REPO_PATH="${{ secrets.DEPLOY_REPO_PATH }}"
            BRANCH="${{ vars.DEPLOY_BRANCH }}"
            if [ -z "$BRANCH" ]; then BRANCH="main"; fi

            cd "$REPO_PATH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            cd deploy
            test -f .env || (echo "Missing deploy/.env on server" && exit 1)

            docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build --remove-orphans
            docker image prune -f
